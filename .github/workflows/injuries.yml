name: NBA injuries

on:
  schedule:
    - cron: "*/30 * * * *"   # mudanças, de 30 em 30 minutos
    - cron: "0 20 * * *"     # resumo do dia (20:00 UTC = 20:00 Lisboa no inverno, 21:00 no verão)
  workflow_dispatch:
    inputs:
      mode:
        description: "changes = só mudanças | digest = resumo do dia | summary = lista completa | check = diagnóstico (não posta)"
        type: choice
        options:
          - changes
          - digest
          - summary
          - check
        default: changes

permissions:
  contents: write

concurrency:
  group: injuries
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar leitor do relatório oficial
        continue-on-error: true   # se falhar, o bot continua só com a ESPN
        run: pip install -r requirements.txt

      - name: Correr o bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${INPUT_MODE:-changes}"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 20 * * *" ]; then MODE=digest; fi
          echo "Modo: $MODE"
          python nba_injuries.py --mode "$MODE"

      - name: Guardar estado
        run: |
          if [ -f state.json ]; then
            git config user.name "injury-bot"
            git config user.email "injury-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state" && git push)
          fi
